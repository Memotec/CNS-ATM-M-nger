<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNS Manager - Camera Fix</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Thư viện quét QR -->
    <script src="https://unpkg.com/html5-qrcode"></script>
    <style>
        #reader { width: 100%; border-radius: 12px; overflow: hidden; }
        .tab-content { display: none; }
        .active { display: block; }
    </style>
</head>
<body class="bg-slate-100">

    <header class="bg-blue-900 text-white p-4 shadow-md text-center">
        <h1 class="font-bold uppercase">Hệ thống Kỹ thuật VHF/VCCS</h1>
    </header>

    <nav class="flex bg-white shadow mb-4">
        <button onclick="switchTab('log')" class="flex-1 py-3 font-bold border-b-2">Nhật ký</button>
        <button onclick="switchTab('qr')" class="flex-1 py-3 font-bold border-b-2 text-blue-600 border-blue-600">Quét QR</button>
    </nav>

    <main class="p-4 max-w-2xl mx-auto">
        <!-- Tab Nhật ký -->
        <section id="log" class="tab-content bg-white p-4 rounded-lg shadow">
            <h2 class="font-bold mb-2 text-blue-800">Nhật ký trực ca</h2>
            <div id="log-list" class="text-sm space-y-2"></div>
        </section>

        <!-- Tab Quét QR -->
        <section id="qr" class="tab-content active bg-white p-4 rounded-lg shadow">
            <h2 class="font-bold mb-4 text-blue-800">Quản lý Tài sản & QR Code</h2>
            
            <div id="reader" class="mb-4 bg-slate-200"></div>
            
            <div class="flex gap-2">
                <button onclick="startScan()" class="flex-1 bg-blue-600 text-white py-3 rounded-lg font-bold">BẬT CAMERA</button>
                <button onclick="stopScan()" class="flex-1 bg-red-500 text-white py-3 rounded-lg font-bold">TẮT</button>
            </div>

            <div id="result" class="mt-4 p-3 bg-green-50 border border-green-200 rounded hidden text-center">
                <p class="text-xs text-green-600 font-bold uppercase">Kết quả quét:</p>
                <p id="qr-text" class="text-lg font-mono font-bold text-slate-800"></p>
            </div>
            
            <p id="error-msg" class="mt-2 text-red-500 text-xs italic text-center"></p>
        </section>
    </main>

    <script>
        let scanner = null;

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.getElementById(id).classList.add('active');
            if (id !== 'qr') stopScan();
        }

        async function startScan() {
            const errorEl = document.getElementById('error-msg');
            const resultBox = document.getElementById('result');
            errorEl.innerText = "";
            resultBox.classList.add('hidden');

            // Kiểm tra xem trình duyệt có hỗ trợ camera không
            if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) {
                errorEl.innerText = "Lỗi: Trình duyệt của bạn không hỗ trợ camera hoặc đang dùng HTTP thay vì HTTPS.";
                return;
            }

            if (!scanner) {
                scanner = new Html5Qrcode("reader");
            }

            try {
                const config = { fps: 10, qrbox: { width: 250, height: 250 } };
                
                await scanner.start(
                    { facingMode: "environment" }, // Ưu tiên camera sau
                    config,
                    (decodedText) => {
                        document.getElementById('qr-text').innerText = decodedText;
                        resultBox.classList.remove('hidden');
                        stopScan(); // Tắt sau khi quét xong
                    }
                );
            } catch (err) {
                errorEl.innerText = "Không thể bật camera. Hãy kiểm tra quyền truy cập (Permission) trên trình duyệt.";
                console.error(err);
            }
        }

        function stopScan() {
            if (scanner) {
                scanner.stop().then(() => {
                    scanner.clear();
                    scanner = null;
                }).catch(err => console.warn("Lỗi khi tắt camera: ", err));
            }
        }
    </script>
</body>
</html>
