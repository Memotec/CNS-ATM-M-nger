<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CNS Manager Pro - VATM Southern</title>
    <!-- Thư viện hỗ trợ -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://unpkg.com/html5-qrcode"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/jsbarcode@3.11.5/dist/JsBarcode.all.min.js"></script>
    
    <style>
        @font-face { font-family: 'TNR'; src: local('Times New Roman'); }
        .tab-content { display: none; }
        .tab-content.active { display: block; }
        .nav-active { border-bottom: 4px solid white; opacity: 1 !important; }
        
        /* Style cho phân hệ IN NHÃN */
        .input-group label { display: block; font-size: 12px; font-weight: bold; margin-bottom: 2px; color: #475569; }
        .input-group input { width: 100%; padding: 6px; border: 1px solid #cbd5e1; border-radius: 4px; font-size: 13px; }
        .size-val { width: 50px; font-weight: bold; color: #2563eb; text-align: right; font-size: 12px; }
        
        /* Khu vực hiển thị nhãn Barcode */
        #print-zone { display: flex; flex-wrap: wrap; gap: 10px; justify-content: center; margin-top: 20px; }
        .label-item { background: white; border: 0.1mm solid #000; display: flex; flex-direction: column; box-sizing: border-box; overflow: hidden; page-break-inside: avoid; font-family: 'TNR', serif; }
        .label-table { width: 100%; border-collapse: collapse; table-layout: fixed; }
        .label-table td { border: 0.5pt solid black; padding: 1px 4px; font-size: 9pt; color: black; overflow: hidden; white-space: nowrap; }
        .col-title { width: 30%; font-weight: normal; }
        .col-content { width: 70%; font-weight: bold; }
        .barcode-section { width: 100%; flex-grow: 1; display: flex; justify-content: center; align-items: center; border: 0.5pt solid black; border-top: none; padding: 1mm 0; }
        .barcode-wrapper { width: 35mm; display: flex; justify-content: center; align-items: center; }

        @media print {
            body * { visibility: hidden; }
            #print-zone, #print-zone * { visibility: visible; }
            #print-zone { position: absolute; left: 0; top: 0; display: block; }
            .label-item { margin-bottom: 5mm; border: 0.1mm solid #000; }
            @page { margin: 5mm; }
        }
    </style>
</head>
<body class="bg-slate-100 font-sans text-slate-800">

    <header class="bg-[#1e3a8a] text-white p-4 shadow-lg sticky top-0 z-50">
        <div class="flex justify-between items-center max-w-5xl mx-auto">
            <div>
                <h1 class="text-sm font-bold uppercase tracking-widest">Đội Thông Tin - VATM</h1>
                <p class="text-[10px] opacity-80">Quản lý Kỹ thuật & In Nhãn Tài Sản</p>
            </div>
            <div class="text-right text-[10px]">
                <p>KTV: Trần Văn Trường</p>
                <p id="clock"></p>
            </div>
        </div>
    </header>

    <nav class="bg-[#2563eb] text-white flex justify-around sticky top-[62px] z-40 shadow-md">
        <button onclick="switchTab('tab-inv')" id="btn-inv" class="py-3 px-1 text-[10px] font-bold opacity-70 nav-active">THIẾT BỊ</button>
        <button onclick="switchTab('tab-log')" id="btn-log" class="py-3 px-1 text-[10px] font-bold opacity-70">NHẬT KÝ</button>
        <button onclick="switchTab('tab-print')" id="btn-print" class="py-3 px-1 text-[10px] font-bold opacity-70 text-amber-300">IN NHÃN BC</button>
        <button onclick="switchTab('tab-qr')" id="btn-qr" class="py-3 px-1 text-[10px] font-bold opacity-70">QUÉT/TẠO QR</button>
    </nav>

    <main class="p-4 max-w-5xl mx-auto">

        <!-- TAB 1: THIẾT BỊ -->
        <section id="tab-inv" class="tab-content active">
            <div class="bg-white p-4 rounded-xl shadow border">
                <h2 class="font-bold text-blue-900 uppercase text-sm mb-4">Danh mục thiết bị trạm</h2>
                <div class="overflow-x-auto text-[11px]">
                    <table class="w-full border-collapse">
                        <thead><tr class="bg-slate-100"><th class="p-2 border">Tên</th><th class="p-2 border">S/N</th><th class="p-2 border">Vị trí</th></tr></thead>
                        <tbody>
                            <tr><td class="p-2 border">Card VDA Sitti</td><td class="p-2 border font-mono">SN-8821</td><td class="p-2 border">Slot 01</td></tr>
                            <tr><td class="p-2 border">Jotron 7100 TX</td><td class="p-2 border font-mono">SN-9912</td><td class="p-2 border">Rack A</td></tr>
                        </tbody>
                    </table>
                </div>
            </div>
        </section>

        <!-- TAB 2: NHẬT KÝ -->
        <section id="tab-log" class="tab-content">
            <div class="bg-white p-4 rounded-xl shadow border">
                <input type="text" id="log-dev" placeholder="Thiết bị..." class="w-full border p-2 rounded mb-2 text-sm">
                <textarea id="log-txt" placeholder="Nội dung xử lý..." class="w-full border p-2 rounded h-20 text-sm mb-2"></textarea>
                <button onclick="saveLog()" class="w-full bg-blue-700 text-white py-2 rounded font-bold text-sm">LƯU NHẬT KÝ</button>
                <div id="log-list" class="mt-4 space-y-2"></div>
            </div>
        </section>

        <!-- TAB 3: IN NHÃN BARCODE (Tích hợp công cụ của bạn) -->
        <section id="tab-print" class="tab-content">
            <div class="bg-white p-4 rounded-xl shadow border mb-4">
                <h2 class="font-bold text-blue-900 uppercase text-sm mb-4">Cấu hình in nhãn Barcode</h2>
                <div class="grid grid-cols-2 gap-3 mb-4">
                    <div class="input-group"><label>Tên Công Cụ</label><input type="text" id="inTen" value="Card M800IP"></div>
                    <div class="input-group"><label>Mã Công Cụ</label><input type="text" id="inMa" value="CNS-VCCS-01"></div>
                    <div class="input-group"><label>S/N</label><input type="text" id="inSN" placeholder="Số Serial"></div>
                    <div class="input-group"><label>Nơi đặt</label><input type="text" id="inNoiDat" value="Trạm Ho Chi Minh ACC"></div>
                </div>
                
                <div class="bg-slate-50 p-3 rounded-lg space-y-2 mb-4 border border-slate-200">
                    <div class="flex items-center gap-4">
                        <label class="w-24 text-[11px] font-bold">Ngang/Cao:</label>
                        <input type="range" id="wSld" min="40" max="100" value="60" oninput="updateBCStyle()" class="flex-1">
                        <span class="size-val" id="wTxt">60mm</span>
                        <input type="range" id="hSld" min="30" max="60" value="40" oninput="updateBCStyle()" class="flex-1">
                        <span class="size-val" id="hTxt">40mm</span>
                    </div>
                </div>

                <div class="flex gap-2">
                    <button onclick="addLabel()" class="flex-1 bg-blue-600 text-white py-2 rounded font-bold text-xs">+ THÊM NHÃN</button>
                    <button onclick="window.print()" class="flex-1 bg-green-600 text-white py-2 rounded font-bold text-xs">IN TẤT CẢ</button>
                    <button onclick="clearZone()" class="bg-red-500 text-white px-4 rounded font-bold text-xs">XÓA</button>
                </div>
            </div>
            <div id="print-zone"></div>
        </section>

        <!-- TAB 4: QUÉT/TẠO QR -->
        <section id="tab-qr" class="tab-content">
            <div class="bg-white p-4 rounded-xl shadow border mb-4">
                <h3 class="font-bold text-blue-900 mb-2 uppercase text-sm">Quét mã thiết bị</h3>
                <div id="reader" class="bg-slate-100 rounded overflow-hidden"></div>
                <button id="cam-btn" onclick="startScan()" class="w-full bg-green-600 text-white py-2 mt-2 rounded font-bold text-sm text-center">BẬT CAMERA</button>
                <div id="qr-result" class="mt-2 p-2 bg-blue-50 border rounded hidden font-mono text-center text-sm font-bold"></div>
            </div>
            <div class="bg-white p-4 rounded-xl shadow border text-center">
                <h3 class="font-bold text-blue-900 mb-2 uppercase text-sm">Tạo mã QR nhanh</h3>
                <input type="text" id="qr-input" placeholder="Nhập nội dung mã QR..." class="w-full border p-2 rounded mb-2 text-sm">
                <button onclick="makeQR()" class="w-full bg-indigo-600 text-white py-2 rounded font-bold text-sm uppercase">Tạo QR</button>
                <div id="qr-out" class="mt-4 inline-block"></div>
            </div>
        </section>

    </main>

    <script>
        let bcCount = 0;

        function switchTab(id) {
            document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active'));
            document.querySelectorAll('nav button').forEach(b => b.classList.remove('nav-active'));
            document.getElementById(id).classList.add('active');
            document.getElementById('btn-' + id.replace('tab-', '')).classList.add('nav-active');
            if(id !== 'tab-qr') stopScan();
        }

        // --- HÀM CHO IN NHÃN BARCODE ---
        function updateBCStyle() {
            const w = document.getElementById('wSld').value;
            const h = document.getElementById('hSld').value;
            document.getElementById('wTxt').innerText = w + "mm";
            document.getElementById('hTxt').innerText = h + "mm";
            
            document.querySelectorAll('.label-item').forEach(el => {
                el.style.width = w + "mm";
                el.style.height = h + "mm";
            });
        }

        function addLabel() {
            const ten = document.getElementById('inTen').value;
            const ma = document.getElementById('inMa').value;
            const sn = document.getElementById('inSN').value;
            const noi = document.getElementById('inNoiDat').value;
            const w = document.getElementById('wSld').value;
            const h = document.getElementById('hSld').value;

            if(!ma) return alert("Cần có Mã CC");
            bcCount++;
            const id = `bc-${bcCount}`;
            const html = `
                <div class="label-item" style="width: ${w}mm; height: ${h}mm;">
                    <table class="label-table">
                        <tr><td class="col-title">Tên CC</td><td class="col-content">${ten}</td></tr>
                        <tr><td class="col-title">Mã CC</td><td class="col-content">${ma}</td></tr>
                        <tr><td class="col-title">S/N</td><td class="col-content">${sn}</td></tr>
                        <tr><td class="col-title">Nơi đặt</td><td class="col-content">${noi}</td></tr>
                    </table>
                    <div class="barcode-section">
                        <div class="barcode-wrapper"><svg id="${id}"></svg></div>
                    </div>
                </div>`;
            document.getElementById('print-zone').insertAdjacentHTML('beforeend', html);
            
            JsBarcode(`#${id}`, ma, {
                format: "CODE128",
                displayValue: false,
                width: 1.5,
                height: 30,
                margin: 0
            });
        }

        function clearZone() { if(confirm("Xóa danh sách in?")) document.getElementById('print-zone').innerHTML = ""; }

        // --- HÀM NHẬT KÝ ---
        function saveLog() {
            const dev = document.getElementById('log-dev').value;
            const txt = document.getElementById('log-txt').value;
            if(!dev || !txt) return;
            const logs = JSON.parse(localStorage.getItem('cns_logs') || '[]');
            logs.unshift({ dev, txt, time: new Date().toLocaleString() });
            localStorage.setItem('cns_logs', JSON.stringify(logs));
            loadLogs();
        }
        function loadLogs() {
            const logs = JSON.parse(localStorage.getItem('cns_logs') || '[]');
            document.getElementById('log-list').innerHTML = logs.map(l => `
                <div class="p-2 bg-white border rounded text-xs shadow-sm">
                    <div class="flex justify-between font-bold text-blue-800"><span>${l.dev}</span><span>${l.time}</span></div>
                    <div class="text-gray-600 italic mt-1">${l.txt}</div>
                </div>`).join('');
        }

        // --- HÀM QR ---
        let scanner = null;
        async function startScan() {
            if(!scanner) scanner = new Html5Qrcode("reader");
            try {
                await scanner.start({facingMode: "environment"}, {fps: 10, qrbox: 250}, (txt) => {
                    document.getElementById('qr-result').innerText = "KẾT QUẢ: " + txt;
                    document.getElementById('qr-result').classList.remove('hidden');
                    stopScan();
                });
                document.getElementById('cam-btn').innerText = "TẮT CAMERA";
                document.getElementById('cam-btn').onclick = stopScan;
            } catch(e) { alert("Lỗi camera!"); }
        }
        function stopScan() {
            if(scanner) {
                scanner.stop(); scanner = null;
                document.getElementById('cam-btn').innerText = "BẬT CAMERA";
                document.getElementById('cam-btn').onclick = startScan;
            }
        }
        function makeQR() {
            const val = document.getElementById('qr-input').value;
            if(!val) return;
            document.getElementById('qr-out').innerHTML = "";
            new QRCode(document.getElementById('qr-out'), { text: val, width: 128, height: 128 });
        }

        // Khởi tạo
        setInterval(() => { document.getElementById('clock').innerText = new Date().toLocaleTimeString(); }, 1000);
        window.onload = loadLogs;
    </script>
</body>
</html>
